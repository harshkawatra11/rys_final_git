<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 | Rajdhani Yuva Sansad</title>
  <meta name="description" content="The page you are looking for could not be found." />
  <style>
    :root { --bg:#050f21; --fg:#f4edd8; --acc:#d4500a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font-family:Arial, sans-serif; }
    .card { width:min(92vw,640px); padding:32px; border:1px solid rgba(255,255,255,.15); border-radius:12px; background:rgba(255,255,255,.03); }
    h1 { margin:0 0 8px; font-size:40px; }
    p { margin:0 0 18px; line-height:1.6; opacity:.9; }
    a { color:white; background:var(--acc); text-decoration:none; padding:10px 16px; border-radius:6px; display:inline-block; font-weight:700; }
  </style>
</head>
<body>
  <main class="card">
    <h1>404</h1>
    <p>The page you requested does not exist or may have moved.</p>
    <a href="/">Go to Home</a>
  </main>
</body>
</html>
